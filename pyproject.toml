[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SplIsoFind"
version = "0.2.0"
description = "Spatial Isoform Finder detects spatially variable isoforms in long-read spatial data"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
  { name = "Lieke Michielsen", email = "lim4020@med.cornell.edu" }
]

keywords = ["spatial transcriptomics", "long read", "alternative splicing", "isoform"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent"
]

requires-python = ">=3.10"

dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "anndata>=0.9",
  "statsmodels>=0.14",
  "scikit-learn>=1.2",
  "libpysal>=4.8",
  "esda>=2.5",
  "joblib>=1.2",
  "tqdm",
  "tqdm_joblib",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
tutorials = [
  "jupyter",
  "seaborn",
  "pillow"
]
test = [
  "pytest"
]

[project.urls]
"Homepage"       = "https://github.com/tilgnerlab/Spl-IsoFind"
"Source Code"    = "https://github.com/tilgnerlab/Spl-IsoFind"
"Documentation"  = "https://splisofind.readthedocs.io"
"Issue Tracker"  = "https://github.com/tilgnerlab/Spl-IsoFind/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
