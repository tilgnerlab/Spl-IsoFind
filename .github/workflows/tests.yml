name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Versions
        run: python -c "import pandas, numpy, scipy; print(pandas.__version__, numpy.__version__, scipy.__version__)"
      - name: Test
        run: python -m pytest -q --import-mode=append tests

  test-oldest-pandas:
    # oldest supported pandas, with numpy 1.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" "pandas==2.0.*" "numpy<2"
      - name: Versions
        run: python -c "import pandas, numpy, scipy; print(pandas.__version__, numpy.__version__, scipy.__version__)"
      - name: Test
        run: python -m pytest -q --import-mode=append tests
